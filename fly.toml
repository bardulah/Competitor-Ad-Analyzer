# Fly.io Deployment Configuration
# Install: curl -L https://fly.io/install.sh | sh
# Deploy: fly launch

app = "competitor-ad-analyzer"
primary_region = "iad"  # Washington DC - change to nearest region

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # Scale to zero when idle

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_gb = 1

# Persistent volume for database
[mounts]
  source = "ad_analyzer_data"
  destination = "/app/data"
